<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NEXORA SECURE TERMINAL</title>
<style>
  :root{
    --green: #39ff9c;
    --green-dim: #1c8a56;
    --green-glow: rgba(57,255,156,0.65);
    --red: #ff3b3b;
    --red-dim: #8a1c1c;
    --red-glow: rgba(255,59,59,0.65);
    --bg: #030604;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Courier New', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Matrix rain background ---------- */
  #matrix{
    position: fixed; inset:0;
    z-index: 0;
    opacity: 0.28;
  }

  #stage{
    position: relative;
    z-index: 1;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at center, rgba(7,16,8,0.4) 0%, rgba(2,4,3,0.65) 70%, rgba(0,0,0,0.85) 100%);
  }

  /* ---------- Start gate ---------- */
  #startgate{
    position: fixed; inset:0; z-index: 300;
    background: #000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor: pointer;
    transition: opacity 0.7s ease;
  }
  #startgate.hide{ opacity:0; pointer-events:none; }
  #startgate .gate-title{
    color: var(--green);
    font-size: clamp(20px, 4vw, 34px);
    letter-spacing: 6px;
    text-shadow: 0 0 12px var(--green-glow);
    margin-bottom: 14px;
  }
  #startgate .gate-sub{
    color: var(--green-dim);
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 48px;
  }
  #startgate .gate-prompt{
    color: var(--green);
    font-size: 13px;
    letter-spacing: 2px;
    padding: 12px 24px;
    border: 1px solid rgba(57,255,156,0.4);
    animation: gate-blink 1.4s ease-in-out infinite;
  }
  @keyframes gate-blink{
    0%,100%{ opacity: 1; box-shadow: 0 0 0 rgba(57,255,156,0); }
    50%{ opacity: 0.45; box-shadow: 0 0 22px rgba(57,255,156,0.3); }
  }
  #startgate .gate-lock{
    position:absolute; top: 22px; right: 26px;
    font-size: 10px; letter-spacing: 2px;
    color: var(--green-dim);
  }

  /* ---------- Mute toggle ---------- */
  #mute-btn{
    position: fixed; top: 16px; right: 16px; z-index: 120;
    width: 38px; height: 38px;
    border: 1px solid rgba(57,255,156,0.4);
    background: rgba(3,10,6,0.6);
    color: var(--green);
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(2px);
    transition: border-color 0.4s ease, color 0.4s ease;
  }
  #stage.alert-mode ~ #mute-btn,
  body.alert-mode #mute-btn{ border-color: rgba(255,59,59,0.5); color: var(--red); }

  /* ---------- CRT / scanline / vignette overlays ---------- */
  .crt-overlay{
    pointer-events:none;
    position:fixed; inset:0; z-index: 50;
  }
  .scanlines{
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode: multiply;
    animation: scan-shift 8s linear infinite;
  }
  @keyframes scan-shift{
    0%{ background-position: 0 0; }
    100%{ background-position: 0 100px; }
  }
  .vignette{
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%);
  }
  .flicker{
    background: rgba(57,255,156,0.02);
    animation: flicker-op 4.2s infinite;
  }
  @keyframes flicker-op{
    0%,19%,21%,23%,55%,57%,100%{ opacity: 1; }
    20%,22%,56%{ opacity: 0.85; }
  }

  #stage.alert-mode .flicker{ background: rgba(255,59,59,0.04); }

  #noise-overlay{
    position: fixed; inset:0; z-index: 60;
    pointer-events:none;
    opacity: 0;
    mix-blend-mode: overlay;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(255,0,0,0.04) 0px, rgba(255,0,0,0.04) 1px, transparent 1px, transparent 3px);
    background-size: 3px 3px, 5px 5px;
  }
  #noise-overlay.burst{ animation: noise-burst 0.15s steps(2) 4; }
  @keyframes noise-burst{
    0%{ opacity: 0; }
    25%{ opacity: 0.9; transform: translate(2px,-1px); }
    50%{ opacity: 0.4; transform: translate(-2px,1px); }
    75%{ opacity: 0.85; transform: translate(1px,2px); }
    100%{ opacity: 0; transform: translate(0,0); }
  }

  #redflash{
    position: fixed; inset:0; z-index: 70;
    background: #ff2b2b;
    opacity: 0;
    pointer-events: none;
  }
  #redflash.flash{ animation: red-flash-kf 0.5s ease-out; }
  @keyframes red-flash-kf{
    0%{ opacity: 0; }
    10%{ opacity: 0.55; }
    100%{ opacity: 0; }
  }

  .intense-shake{ animation: intense-shake-kf 0.25s infinite !important; }
  @keyframes intense-shake-kf{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    20%{ transform: translate(-5px,3px) rotate(-0.4deg); }
    40%{ transform: translate(5px,-3px) rotate(0.4deg); }
    60%{ transform: translate(-4px,-4px) rotate(-0.3deg); }
    80%{ transform: translate(4px,4px) rotate(0.3deg); }
  }
  .shake{ animation: shake-kf 0.4s infinite; }
  @keyframes shake-kf{
    0%,100%{ transform: translate(0,0); }
    20%{ transform: translate(-3px,2px); }
    40%{ transform: translate(3px,-2px); }
    60%{ transform: translate(-2px,-3px); }
    80%{ transform: translate(2px,3px); }
  }

  .chroma{
    text-shadow:
      2px 0 0 rgba(255,0,60,0.7),
      -2px 0 0 rgba(0,255,220,0.5),
      0 0 10px var(--red-glow);
  }

  /* ---------- Terminal window chrome ---------- */
  #terminal-window{
    position: relative;
    width: min(940px, 94vw);
    height: min(660px, 90vh);
    background: linear-gradient(180deg, #05100a 0%, #030905 100%);
    border: 1px solid rgba(57,255,156,0.35);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(57,255,156,0.08),
      0 0 40px rgba(57,255,156,0.18),
      0 0 120px rgba(57,255,156,0.08),
      inset 0 0 60px rgba(0,0,0,0.6);
    display:flex;
    flex-direction: column;
    overflow:hidden;
    transition: border-color 0.6s ease, box-shadow 0.6s ease;
  }
  #stage.alert-mode #terminal-window{
    border-color: rgba(255,59,59,0.45);
    box-shadow:
      0 0 0 1px rgba(255,59,59,0.1),
      0 0 40px rgba(255,59,59,0.25),
      0 0 140px rgba(255,59,59,0.12),
      inset 0 0 60px rgba(0,0,0,0.6);
  }

  .title-bar{
    display:flex; align-items:center; gap:8px;
    padding: 10px 14px;
    background: linear-gradient(180deg, #0a1810 0%, #071009 100%);
    border-bottom: 1px solid rgba(57,255,156,0.18);
  }
  #stage.alert-mode .title-bar{ border-bottom-color: rgba(255,59,59,0.25); }

  .dot{ width:11px; height:11px; border-radius:50%; opacity:0.85; }
  .dot.red{ background:#ff5f57; }
  .dot.yellow{ background:#febc2e; }
  .dot.green{ background:#28c840; }

  .title-label{
    flex:1; text-align:center;
    color: var(--green-dim);
    font-size: 12px; letter-spacing: 3px;
    padding-right: 60px;
    user-select:none;
  }
  #stage.alert-mode .title-label{ color: var(--red-dim); }

  #screen{
    flex:1;
    padding: 20px 24px;
    color: var(--green);
    text-shadow: 0 0 6px var(--green-glow), 0 0 1px var(--green-glow);
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.6;
    position: relative;
  }
  #screen::-webkit-scrollbar{ width:0; }
  #stage.alert-mode #screen{
    color: var(--red);
    text-shadow: 0 0 6px var(--red-glow), 0 0 1px var(--red-glow);
  }

  .line{
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0;
    animation: line-in 0.25s ease forwards;
  }
  @keyframes line-in{
    from{ opacity:0; transform: translateY(2px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .ok{ color: var(--green); }
  .tag-scan{ color: #7dffce; }
  .dim{ color: var(--green-dim); }
  #stage.alert-mode .dim{ color: var(--red-dim); }
  .hex{ color: #2f7a55; font-size: 11.5px; letter-spacing: 1px; }
  .hop{ color: #7dffce; font-size: 12.5px; }
  .hop .hop-ip{ color: var(--green); }
  .hop .hop-loc{ color: var(--green-dim); }

  .cursor{
    display:inline-block; width:8px; height:16px;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
    vertical-align: -3px;
    animation: blink 1s steps(1) infinite;
  }
  #stage.alert-mode .cursor{ background: var(--red); box-shadow: 0 0 8px var(--red-glow); }
  @keyframes blink{ 50%{ opacity:0; } }

  /* advanced segmented progress bar */
  .bar-wrap{
    margin-top: 10px;
    font-size: 15px;
    letter-spacing: 1px;
    max-width: 460px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green-glow);
  }
  .bar-stats{
    margin-top: 6px;
    font-size: 11px;
    color: var(--green-dim);
    display:flex; gap: 18px; flex-wrap: wrap;
  }

  .radar-wrap{
    margin: 12px 0;
    display:flex; align-items:center; gap: 18px;
  }
  .radar{
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 1px solid rgba(57,255,156,0.35);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background: radial-gradient(circle, rgba(57,255,156,0.08) 0%, transparent 70%);
  }
  .radar::before{
    content:'';
    position:absolute; inset:0;
    background: conic-gradient(from 0deg, rgba(57,255,156,0.55) 0deg, transparent 60deg);
    animation: radar-spin 1.6s linear infinite;
  }
  .radar::after{
    content:'';
    position:absolute; top:50%; left:50%;
    width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background: var(--green);
    border-radius:50%;
    box-shadow: 0 0 8px var(--green-glow);
    animation: radar-ping 1.6s ease-in-out infinite;
  }
  @keyframes radar-spin{ to{ transform: rotate(360deg); } }
  @keyframes radar-ping{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .coords{ font-size: 11.5px; color: var(--green-dim); line-height:1.7; }
  .coords span{ color: var(--green); }

  .alert-title{ font-size: 20px; font-weight: bold; margin: 14px 0 6px; letter-spacing: 2px; }

  .countdown-num{
    font-size: 64px; font-weight: bold; text-align: center;
    color: var(--red);
    text-shadow: 0 0 20px var(--red-glow), 0 0 60px var(--red-glow);
    margin: 18px 0;
    animation: pulse-num 0.9s ease;
  }
  @keyframes pulse-num{
    0%{ transform: scale(1.6); opacity:0; }
    40%{ opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }

  /* ---------- Blackout ---------- */
  #blackout{
    position: fixed; inset:0; z-index: 100;
    background:#000; opacity:0; pointer-events:none;
    transition: opacity 0.5s ease;
  }
  #blackout.show{ opacity:1; pointer-events:all; }

  /* ---------- Final reveal ---------- */
  #finale{
    position: fixed; inset:0; z-index: 90;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, #041006 0%, #000 75%);
    opacity:0; pointer-events:none;
    transition: opacity 1.2s ease;
    overflow:hidden;
  }
  #finale.show{ opacity:1; pointer-events:all; }

  .final-content{ position: relative; text-align:center; padding: 20px; max-width: 720px; }

  .final-cursor{
    width:10px; height:24px; background: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
    display:inline-block; animation: blink 1s steps(1) infinite;
  }

  .final-line{
    opacity:0;
    font-size: clamp(22px, 5vw, 42px);
    letter-spacing: 3px;
    margin: 10px 0;
    color: transparent;
    background: linear-gradient(90deg, #ffffff 0%, var(--green) 50%, #ffffff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 18px var(--green-glow));
    font-weight: 700;
  }
  .final-line.sub{
    font-size: clamp(15px, 3vw, 20px);
    letter-spacing: 1px; font-weight: 400;
    color: #d8ffe9; background: none;
    -webkit-background-clip: initial; background-clip: initial;
    filter: none;
    text-shadow: 0 0 12px rgba(57,255,156,0.35);
  }
  @keyframes fade-up{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .heart{
    display:inline-block; color: #ff5d8f;
    filter: drop-shadow(0 0 10px rgba(255,93,143,0.8));
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    25%{ transform: scale(1.18); }
    40%{ transform: scale(0.96); }
    55%{ transform: scale(1.12); }
  }

  .particle{
    position:absolute; border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
    opacity:0; pointer-events:none;
    animation: float-up ease-in forwards;
  }
  @keyframes float-up{
    0%{ opacity:0; transform: translateY(0) scale(0.6); }
    10%{ opacity:0.9; }
    90%{ opacity:0.5; }
    100%{ opacity:0; transform: translateY(-160px) scale(1.1); }
  }

  #replay-btn{
    margin-top: 34px;
    background: transparent;
    border: 1px solid rgba(57,255,156,0.55);
    color: var(--green);
    padding: 12px 26px;
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    border-radius: 4px; cursor: pointer;
    opacity:0;
    text-shadow: 0 0 8px var(--green-glow);
    box-shadow: 0 0 18px rgba(57,255,156,0.12);
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
  }
  #replay-btn:hover{ background: rgba(57,255,156,0.1); box-shadow: 0 0 28px rgba(57,255,156,0.35); }
  #replay-btn:active{ transform: scale(0.97); }

  .disclaimer{
    margin-top: 22px; font-size: 11px; letter-spacing: 1px;
    color: rgba(216,255,233,0.4); opacity:0;
  }

  @media (max-width: 560px){
    #terminal-window{ width: 96vw; height: 92vh; border-radius: 8px; }
    #screen{ font-size: 12px; padding: 14px 14px; }
    .title-label{ font-size: 10px; letter-spacing:2px; padding-right: 48px;}
    .countdown-num{ font-size: 46px; }
    .radar{ width: 58px; height: 58px; }
    .coords{ font-size: 10.5px; }
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="startgate">
  <div class="gate-lock">SIMULATION MODE</div>
  <div class="gate-title">NEXORA SECURE TERMINAL</div>
  <div class="gate-sub">CLASSIFIED ACCESS · AUTHORIZATION REQUIRED</div>
  <div class="gate-prompt">▶ PRESS ANYWHERE TO INITIATE</div>
</div>

<button id="mute-btn" title="Toggle sound">🔊</button>

<div id="stage">
  <div id="terminal-window">
    <div class="title-bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <div class="title-label">NEXORA://SECURE_TERMINAL</div>
    </div>
    <div id="screen"></div>
  </div>

  <div class="crt-overlay scanlines"></div>
  <div class="crt-overlay vignette"></div>
  <div class="crt-overlay flicker"></div>
  <div id="noise-overlay"></div>
  <div id="redflash"></div>
</div>

<div id="blackout"></div>

<div id="finale">
  <div class="final-content" id="finale-content">
    <div id="particle-field"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============ FICTIONAL DATA — VISUAL SIMULATION ONLY ============
  // No real network requests, device access, tracking, or data collection
  // occurs anywhere in this file. Every "IP", "coordinate" and "hop" below
  // is randomly generated in the browser purely for cinematic effect.
  const TARGET_ID = "9236787583";
  // ===================================================================

  const screen = document.getElementById('screen');
  const stage = document.getElementById('stage');
  const blackout = document.getElementById('blackout');
  const finale = document.getElementById('finale');
  const finaleContent = document.getElementById('finale-content');
  const startgate = document.getElementById('startgate');
  const muteBtn = document.getElementById('mute-btn');
  const noiseOverlay = document.getElementById('noise-overlay');
  const redFlash = document.getElementById('redflash');

  let cancelled = false;
  let muted = false;

  // ---------------- Web Audio: synthesized SFX (no external files) ----------------
  let actx = null;
  function ensureAudio(){
    if(!actx){
      try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state === 'suspended') actx.resume();
  }

  function tone(freq, dur, type, gainVal, startAt){
    if(muted || !actx) return;
    const t0 = actx.currentTime + (startAt || 0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal || 0.06, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playTick(){
    tone(1400 + Math.random()*500, 0.03, 'square', 0.025);
  }

  function playConfirm(){
    tone(700, 0.09, 'sine', 0.07);
    tone(1050, 0.12, 'sine', 0.05, 0.06);
  }

  function playAlarm(){
    if(muted || !actx) return;
    for(let i=0;i<3;i++){
      tone(880, 0.18, 'sawtooth', 0.05, i*0.22);
      tone(660, 0.18, 'sawtooth', 0.05, i*0.22 + 0.11);
    }
  }

  function playStatic(){
    if(muted || !actx) return;
    const bufferSize = actx.sampleRate * 0.12;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2 - 1) * 0.5; }
    const noise = actx.createBufferSource();
    noise.buffer = buffer;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(0.06, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.12);
    noise.connect(gain).connect(actx.destination);
    noise.start();
  }

  function playHeartbeat(){
    tone(90, 0.16, 'sine', 0.12);
    tone(70, 0.2, 'sine', 0.1, 0.18);
  }

  function playCountdownBeep(urgent){
    tone(urgent ? 520 : 340, 0.14, 'square', 0.05);
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------------- Matrix rain background ----------------
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let matrixCols = [];
  const glyphs = 'アイウエオカキクケコサシスセソ0123456789NEXORA$#%&';

  function setupMatrix(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const fontSize = 15;
    const cols = Math.floor(canvas.width / fontSize);
    matrixCols = new Array(cols).fill(0).map(() => Math.random() * -100);
  }
  setupMatrix();
  window.addEventListener('resize', setupMatrix);

  function drawMatrix(){
    ctx.fillStyle = 'rgba(2,6,3,0.12)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const fontSize = 15;
    ctx.font = fontSize + 'px monospace';
    for(let i=0; i<matrixCols.length; i++){
      const isAlert = stage.classList.contains('alert-mode');
      ctx.fillStyle = isAlert
        ? (Math.random() > 0.94 ? '#ffb3b3' : 'rgba(255,59,59,0.55)')
        : (Math.random() > 0.94 ? '#c8ffe4' : 'rgba(57,255,156,0.45)');
      const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
      ctx.fillText(ch, i * fontSize, matrixCols[i] * fontSize);
      if(matrixCols[i] * fontSize > canvas.height && Math.random() > 0.975){
        matrixCols[i] = 0;
      }
      matrixCols[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }
  requestAnimationFrame(drawMatrix);

  // ---------------- helpers ----------------
  function sleep(ms){
    return new Promise(res => {
      const id = setTimeout(res, ms);
      sleep._timers = sleep._timers || [];
      sleep._timers.push(id);
    });
  }
  function clearAllTimers(){
    (sleep._timers || []).forEach(clearTimeout);
    sleep._timers = [];
  }
  function scrollDown(){ screen.scrollTop = screen.scrollHeight; }

  function triggerNoiseBurst(){
    noiseOverlay.classList.remove('burst');
    void noiseOverlay.offsetWidth;
    noiseOverlay.classList.add('burst');
    playStatic();
  }
  function triggerRedFlash(){
    redFlash.classList.remove('flash');
    void redFlash.offsetWidth;
    redFlash.classList.add('flash');
  }

  function addLine(html, cls){
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.innerHTML = html;
    screen.appendChild(div);
    scrollDown();
    return div;
  }

  function typeLine(text, opts){
    opts = opts || {};
    const speed = opts.speed || 18;
    const cls = opts.cls || '';
    return new Promise(resolve => {
      const div = document.createElement('div');
      div.className = 'line ' + cls;
      div.style.opacity = 1;
      screen.appendChild(div);
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      let i = 0;
      function step(){
        if(cancelled) return resolve();
        if(i <= text.length){
          div.textContent = text.slice(0, i);
          div.appendChild(cursor);
          scrollDown();
          if(i % 2 === 0 && text[i] && text[i] !== ' ') playTick();
          i++;
          setTimeout(step, speed);
        } else {
          cursor.remove();
          resolve();
        }
      }
      step();
    });
  }

  function randHex(len){
    let s = '';
    for(let i=0;i<len;i++) s += Math.floor(Math.random()*16).toString(16);
    return s.toUpperCase();
  }
  function randIP(){
    return `${10+Math.floor(Math.random()*180)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
  }
  function randCoord(){
    const lat = (Math.random()*180-90).toFixed(4);
    const lon = (Math.random()*360-180).toFixed(4);
    return `${lat}, ${lon}`;
  }

  // ---------------- sequence stages ----------------
  async function bootSequence(){
    addLine('<span class="dim">═══════════════════════════════════════</span>');
    await typeLine('NEXORA SECURE TERMINAL', {speed: 32});
    await sleep(250);
    await typeLine('Initializing secure environment...', {speed: 15, cls:'dim'});
    await sleep(200);
    await typeLine('Loading encryption modules...', {speed: 15, cls:'dim'});
    await sleep(200);
    addLine(`<span class="hex">AES-256 KEY :: ${randHex(32)}</span>`);
    await sleep(150);
    await typeLine('System integrity check...', {speed: 15, cls:'dim'});
    await sleep(300);
    addLine('<span class="dim">═══════════════════════════════════════</span>');
    await sleep(250);
  }

  async function systemLogs(){
    const logs = [
      '[OK] Core system initialized',
      '[OK] Encryption module loaded',
      '[OK] Secure channel established'
    ];
    for(const log of logs){
      await typeLine(log, {speed: 13, cls:'ok'});
      playConfirm();
      await sleep(200);
    }
    await sleep(350);
  }

  async function networkTrace(){
    await typeLine('> trace_route(secure_relay)', {speed: 20});
    await sleep(250);
    await typeLine('[NET] Routing through encrypted relay nodes...', {speed: 12, cls:'tag-scan'});
    await sleep(200);

    const hopCount = 5;
    for(let i=1; i<=hopCount; i++){
      const div = document.createElement('div');
      div.className = 'line hop';
      div.style.opacity = 1;
      div.innerHTML = `HOP ${i.toString().padStart(2,'0')}  <span class="hop-ip">${randIP()}</span>  <span class="hop-loc">:: relay-node-${randHex(3)}</span>`;
      screen.appendChild(div);
      scrollDown();
      playTick();
      await sleep(180);
    }
    await sleep(200);
    await typeLine('[NET] Relay chain secured. Anonymity layer: ACTIVE', {speed: 12, cls:'ok'});
    await sleep(400);
  }

  async function targetSearch(){
    addLine('');
    await typeLine('> locate_target()', {speed: 22});
    await sleep(250);
    await typeLine('[SCAN] Searching target database...', {speed: 13, cls:'tag-scan'});

    // radar + fake ticking coordinates while "searching"
    const radarWrap = document.createElement('div');
    radarWrap.className = 'line radar-wrap';
    radarWrap.style.opacity = 1;
    radarWrap.innerHTML = `
      <div class="radar"></div>
      <div class="coords" id="coord-readout">
        LAT/LONG :: <span>${randCoord()}</span><br>
        SIGNAL :: <span>ACQUIRING...</span><br>
        NODE ID :: <span>${randHex(8)}</span>
      </div>`;
    screen.appendChild(radarWrap);
    scrollDown();

    const coordSpan = radarWrap.querySelector('.coords span');
    const tickInterval = setInterval(() => {
      if(coordSpan) coordSpan.textContent = randCoord();
    }, 220);
    await sleep(1400);
    clearInterval(tickInterval);
    const lines = radarWrap.querySelectorAll('.coords span');
    if(lines[1]) lines[1].textContent = 'LOCKED';

    await sleep(300);
    await typeLine('[SCAN] Target found.', {speed: 18, cls:'tag-scan'});
    playConfirm();
    await sleep(500);

    addLine('');
    await typeLine('TARGET ID: ' + TARGET_ID, {speed: 24});
    await sleep(250);
    await typeLine('IDENTIFICATION STATUS: MATCHED', {speed: 16, cls:'ok'});
    await sleep(150);
    await typeLine('SECURITY LEVEL: HIGH', {speed: 16, cls:'ok'});
    await sleep(450);
  }

  async function progressBar(){
    addLine('');
    await typeLine('Decrypting security profile...', {speed: 13, cls:'dim'});

    const wrap = document.createElement('div');
    wrap.className = 'line bar-wrap';
    wrap.style.opacity = 1;
    screen.appendChild(wrap);

    const stats = document.createElement('div');
    stats.className = 'line bar-stats';
    stats.style.opacity = 1;
    stats.innerHTML = `<span id="stat-speed">0 MB/s</span><span id="stat-eta">ETA --s</span><span id="stat-pkt">PKT 0/512</span>`;
    screen.appendChild(stats);
    scrollDown();

    const totalBlocks = 30;
    const duration = 2600;
    const start = performance.now();

    await new Promise(resolve => {
      function tick(now){
        if(cancelled) return resolve();
        const t = Math.min(1, (now - start) / duration);
        const filled = Math.round(t * totalBlocks);
        const bar = '█'.repeat(filled) + '░'.repeat(totalBlocks - filled);
        wrap.textContent = `[${bar}] ${Math.round(t*100)}%`;

        document.getElementById('stat-speed').textContent = (18 + Math.random()*40).toFixed(1) + ' MB/s';
        document.getElementById('stat-eta').textContent = 'ETA ' + Math.max(0, Math.ceil((1-t) * (duration/1000))) + 's';
        document.getElementById('stat-pkt').textContent = 'PKT ' + Math.round(t*512) + '/512';

        if(filled % 6 === 0) playTick();
        scrollDown();
        if(t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });

    document.getElementById('stat-eta').textContent = 'ETA 0s';
    await sleep(350);
  }

  async function alertSequence(){
    stage.classList.add('alert-mode');
    const win = document.getElementById('terminal-window');

    playAlarm();
    triggerRedFlash();
    triggerNoiseBurst();
    win.classList.add('intense-shake');
    await sleep(350);

    addLine('');
    const alertDiv = document.createElement('div');
    alertDiv.className = 'line alert-title glitch active chroma';
    alertDiv.textContent = '⚠ SECURITY ALERT ⚠';
    alertDiv.style.opacity = 1;
    screen.appendChild(alertDiv);
    scrollDown();

    await sleep(500);
    win.classList.remove('intense-shake');
    win.classList.add('shake');

    const sub = document.createElement('div');
    sub.className = 'line alert-title glitch active chroma';
    sub.style.fontSize = '15px';
    sub.textContent = 'UNAUTHORIZED SIMULATION DETECTED';
    sub.style.opacity = 1;
    screen.appendChild(sub);
    scrollDown();

    await sleep(500);
    triggerNoiseBurst();
    await typeLine('[ALERT] Firewall breach detected', {speed: 9, cls:'alert-title'});
    await sleep(120);
    triggerRedFlash();
    await typeLine('[ALERT] Connection integrity compromised', {speed: 9, cls:'alert-title'});
    await sleep(120);
    await typeLine('[ALERT] Tracing origin signal...', {speed: 9, cls:'alert-title'});
    await sleep(250);
    triggerNoiseBurst();
    await sleep(450);

    win.classList.remove('shake');
  }

  async function countdown(){
    const win = document.getElementById('terminal-window');
    addLine('');
    await typeLine('SYSTEM LOCKDOWN IN...', {speed: 20, cls:'alert-title chroma'});
    await sleep(250);

    const numDiv = document.createElement('div');
    numDiv.className = 'countdown-num chroma';
    screen.appendChild(numDiv);
    scrollDown();

    for(let n = 5; n >= 1; n--){
      if(cancelled) return;
      numDiv.style.animation = 'none';
      void numDiv.offsetWidth;
      numDiv.style.animation = 'pulse-num 0.9s ease';
      numDiv.textContent = '0' + n;

      triggerNoiseBurst();
      playCountdownBeep(n <= 2);
      if(n <= 3){ triggerRedFlash(); }
      win.classList.add(n <= 2 ? 'intense-shake' : 'shake');

      await sleep(n <= 2 ? 580 : 720);
      win.classList.remove('shake');
      win.classList.remove('intense-shake');
    }

    triggerRedFlash();
    triggerNoiseBurst();
    playStatic();
    win.classList.add('intense-shake');
    await sleep(280);
    win.classList.remove('intense-shake');
  }

  async function doBlackout(){
    blackout.classList.add('show');
    await sleep(2000);
  }

  function spawnParticles(){
    const field = document.getElementById('particle-field');
    const count = window.innerWidth < 560 ? 14 : 26;
    for(let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = (Math.random() * 100) + '%';
      p.style.top = (40 + Math.random() * 40) + '%';
      p.style.animationDuration = (3 + Math.random() * 3) + 's';
      p.style.animationDelay = (Math.random() * 3) + 's';
      field.appendChild(p);
    }
  }

  async function finaleSequence(){
    stage.classList.remove('alert-mode');
    finale.classList.add('show');
    spawnParticles();

    await sleep(200);
    blackout.classList.remove('show');

    const cursorLine = document.createElement('div');
    cursorLine.className = 'final-cursor';
    finaleContent.appendChild(cursorLine);
    await sleep(1400);
    cursorLine.remove();

    const lines = [
      { text: 'ACCESS GRANTED', cls: '', pause: 1300, beat: true },
      { text: 'Okay... relax 😂', cls: 'sub', pause: 1400 },
      { text: "You didn't actually get hacked.", cls: 'sub', pause: 1200 },
      { text: 'I just wanted to make something special for you', cls: '', pause: 200, heart: true }
    ];

    for(const item of lines){
      const div = document.createElement('div');
      div.className = 'final-line' + (item.cls ? ' ' + item.cls : '');
      div.textContent = item.text;
      if(item.heart){
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = ' ❤️';
        div.appendChild(h);
      }
      div.style.animation = 'fade-up 1.1s ease forwards';
      finaleContent.appendChild(div);
      scrollDown();
      if(item.beat) playHeartbeat();
      await sleep(item.pause + 900);
    }

    const disclaimer = document.createElement('div');
    disclaimer.className = 'disclaimer';
    disclaimer.textContent = 'A harmless simulation. No data was accessed, no device was contacted.';
    disclaimer.style.animation = 'fade-up 1s ease forwards';
    finaleContent.appendChild(disclaimer);

    const btn = document.createElement('button');
    btn.id = 'replay-btn';
    btn.textContent = 'RUN SIMULATION AGAIN';
    btn.style.animation = 'fade-up 1s ease forwards';
    btn.addEventListener('click', restart);
    finaleContent.appendChild(btn);
  }

  async function restart(){
    cancelled = true;
    clearAllTimers();
    await sleep(50);
    cancelled = false;

    finale.classList.remove('show');
    finaleContent.innerHTML = '';
    blackout.classList.remove('show');
    stage.classList.remove('alert-mode');
    screen.innerHTML = '';

    await sleep(600);
    runSequence();
  }

  async function runSequence(){
    await bootSequence();
    if(cancelled) return;
    await systemLogs();
    if(cancelled) return;
    await networkTrace();
    if(cancelled) return;
    await targetSearch();
    if(cancelled) return;
    await progressBar();
    if(cancelled) return;
    await alertSequence();
    if(cancelled) return;
    await countdown();
    if(cancelled) return;
    await doBlackout();
    if(cancelled) return;
    await finaleSequence();
  }

  function begin(){
    ensureAudio();
    startgate.classList.add('hide');
    setTimeout(() => { startgate.style.display = 'none'; }, 750);
    runSequence();
  }

  startgate.addEventListener('click', begin, { once: true });
  startgate.addEventListener('touchstart', begin, { once: true });
})();
</script>
