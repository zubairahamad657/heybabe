<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Map Example</title>
</head>
<body>

<img src="C:\Users\user\Pictures\face.jpg" alt="Map Image" usemap="#imagemap" width="600">

<map name="imagemap">
    <!-- Rectangle Area -->
    <area shape="rect" coords="50,50,200,150" href="https://google.com" alt="Google">

    <!-- Circle Area -->
    <area shape="circle" coords="350,120,60" href="https://youtube.com" alt="YouTube">

    <!-- Polygon Area -->
    <area shape="poly" coords="450,50,550,80,530,180,430,150" href="https://github.com" alt="GitHub">
</map>

</body>
</html>
