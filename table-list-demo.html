<html>
<head>
    <title>Table list</title>
    <style>
        table {
            border:2px solid black;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow';
            padding: 10px;
            width: 100%;
            color: black;
            background-color: lightblue;
        }
         th,td {
            border: 1px solid black;
            padding: 20px;
            font-size: 16px;
            color: blue;
            background-color: aliceblue;
            font-family: arial;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
    <body>
        <table>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>30</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>25</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Joe Johnson</td>
                <td>35</td>
            </tr>
        </table>
    </body>
</html>
